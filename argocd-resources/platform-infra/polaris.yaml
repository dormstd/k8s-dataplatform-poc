---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: polaris
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - cluster: in-cluster
  template:
    metadata:
      name: polaris
    spec:
      destination:
        name: "{{cluster}}"
        namespace: polaris-system
      project: default
      source:
        path: manifests/platform-infra/polaris
        repoURL: https://github.com/dormstd/k8s-dataplatform-poc.git
        targetRevision: HEAD
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true