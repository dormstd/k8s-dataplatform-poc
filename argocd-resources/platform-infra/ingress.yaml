---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ingress-nginx
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - cluster: in-cluster
  template:
    metadata:
      name: ingress-nginx
    spec:
      destination:
        name: "{{cluster}}"
        namespace: ingress-nginx
      project: default
      source:
        path: manifests/platform-infra/ingress-nginx
        repoURL: https://github.com/dormstd/k8s-dataplatform-poc.git
        targetRevision: HEAD
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true