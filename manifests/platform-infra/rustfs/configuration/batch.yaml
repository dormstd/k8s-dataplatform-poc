apiVersion: batch/v1
kind: Job
metadata:
  name: create-rustfs-buckets
spec:
  template:
    spec:
      containers:
      - name: mc
        image: bitnamilegacy/minio:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          until mc alias set local http://rustfs-service:9000 admin password123; do 
            echo "Esperando a que el servicio rustfs esté listo..."
            sleep 2
          done;
          mc mb --ignore-existing local/sales-bucket;
          mc mb --ignore-existing local/stock-bucket;
          mc mb --ignore-existing local/purchase-bucket;
      restartPolicy: OnFailure
